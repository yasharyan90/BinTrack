# BinTrack — Supabase local development configuration
# Schema reference: https://supabase.com/docs/guides/local-development/cli/config
# Written for Supabase CLI v2.
project_id = "bintrack"

[api]
enabled = true
port = 54321
# `storage` is exposed so the CSV import can read back what it uploaded.
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Emails are captured locally instead of being delivered, so signup
# confirmations and magic links can be inspected in the browser.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.imports]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["text/csv", "application/vnd.ms-excel", "text/plain"]

[storage.buckets.product-images]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/avif"]

[storage.buckets.labels]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["application/pdf"]

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local dev: skip the confirmation mail so a new account can sign in at once.
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[functions.csv-import]
verify_jwt = true

[functions.label-pdf]
verify_jwt = true

# Invoked by a schedule or a service-role call, not by a browser session.
[functions.alert-digest]
verify_jwt = false

# Authenticated by an HMAC signature instead of a Supabase JWT.
[functions.order-webhook]
verify_jwt = false

[analytics]
enabled = false
